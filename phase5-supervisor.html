<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task Tracker Supervisor Operations Pilot</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{max-width:1200px;margin:0 auto;padding:28px 20px 48px}.topbar,.row{display:flex;justify-content:space-between;gap:16px;align-items:center}.topbar{margin-bottom:22px}.brand h1{margin:0;font-size:28px}.brand p,.muted{color:#64748b}.card{background:#fff;border:1px solid #dbe3ef;border-radius:16px;padding:22px;margin-bottom:18px;box-shadow:0 8px 24px rgba(15,23,42,.04)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.full{grid-column:1/-1}label{display:block;font-weight:700;font-size:13px;margin-bottom:7px}input,select,textarea{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:11px 12px;background:#fff}textarea{min-height:90px}.primary,.secondary,.danger{border-radius:10px;padding:11px 16px;font-weight:800}.primary{border:0;background:#1d4ed8;color:white}.secondary{border:1px solid #cbd5e1;background:white}.danger{border:1px solid #fecaca;background:#fff;color:#b91c1c}.message{padding:11px 13px;border-radius:10px;background:#e2e8f0;margin-bottom:18px}.message[data-type="error"]{background:#fee2e2;color:#991b1b}.message[data-type="success"]{background:#dcfce7;color:#166534}.tasks{display:grid;gap:12px}.task{border:1px solid #e2e8f0;border-radius:12px;padding:14px;background:#f8fafc}.task h3{margin:0 0 6px}.meta{font-size:13px;color:#64748b}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.pill{display:inline-flex;padding:4px 8px;border-radius:999px;background:#dbeafe;color:#1d4ed8;font-size:12px;font-weight:800}.urgent{background:#fee2e2;color:#991b1b}.high{background:#ffedd5;color:#9a3412}.normal{background:#e0f2fe;color:#075985}.low{background:#ecfccb;color:#3f6212}[hidden]{display:none!important}@media(max-width:720px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.topbar,.row{align-items:stretch;flex-direction:column}}
  </style>
</head>
<body>
<div class="shell">
  <div class="topbar"><div class="brand"><h1>Supervisor Operations Pilot</h1><p>Phase 5 shared supervisor workflow validation</p></div><a class="secondary" href="phase5-pilot.html" style="text-decoration:none;color:inherit">Employee Pilot</a></div>
  <div id="message" class="message" hidden></div>
  <section id="login" class="card"><form id="login-form" class="grid"><div><label for="employee">Employee</label><select id="employee" required><option value="">Loading employees...</option></select></div><div><label for="pin">PIN</label><input id="pin" type="password" inputmode="numeric" required></div><div class="full"><button class="primary" type="submit">Sign In</button></div></form></section>
  <main id="app" hidden>
    <section class="card"><div class="row"><div><div class="muted">Signed in as</div><strong id="user-name"></strong></div><div style="display:flex;gap:10px;flex-wrap:wrap"><label style="margin:0;display:flex;align-items:center;gap:8px"><input id="include-completed" type="checkbox" style="width:auto">Show completed/cancelled</label><button id="refresh" class="secondary" type="button">Refresh</button></div></div></section>
    <section id="create-card" class="card" hidden><h2 style="margin-top:0">Assign Supervisor Task</h2><form id="create-form" class="grid"><div><label for="assigned-supervisor">Assigned Supervisor</label><select id="assigned-supervisor"></select></div><div><label for="task-type">Task Type</label><select id="task-type"></select></div><div><label for="linked-employee">Employee (optional)</label><select id="linked-employee"></select></div><div><label for="priority">Priority</label><select id="priority"><option>Low</option><option selected>Normal</option><option>High</option><option>Urgent</option></select></div><div><label for="business-date">Business Date</label><input id="business-date" type="date"></div><div><label for="due-date">Due Date</label><input id="due-date" type="date"></div><div class="full"><label for="title">Title</label><input id="title" type="text" maxlength="200" required></div><div class="full"><label for="details">Details</label><textarea id="details"></textarea></div><div class="full"><button class="primary" type="submit">Create Supervisor Task</button></div></form></section>
    <section class="card"><div class="row"><div><h2 style="margin:0">Supervisor Task Queue</h2><div class="muted">Pending, in-progress, and optional history</div></div><span id="task-count" class="pill">0</span></div><div id="tasks" class="tasks" style="margin-top:16px"></div></section>
    <section id="complete-card" class="card" hidden><h2 style="margin-top:0">Complete Task</h2><div id="complete-summary" class="muted"></div><label for="completion-notes" style="margin-top:14px">Completion Notes</label><textarea id="completion-notes"></textarea><div class="actions"><button id="confirm-complete" class="primary" type="button">Complete Task</button><button id="cancel-complete" class="secondary" type="button">Cancel</button></div></section>
    <section id="cancel-card" class="card" hidden><h2 style="margin-top:0">Cancel Task</h2><div id="cancel-summary" class="muted"></div><label for="cancel-reason" style="margin-top:14px">Cancellation Reason</label><textarea id="cancel-reason"></textarea><div class="actions"><button id="confirm-cancel" class="danger" type="button">Cancel Task</button><button id="close-cancel" class="secondary" type="button">Keep Task</button></div></section>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/phase5-supervisor.js"></script>
</body></html>
