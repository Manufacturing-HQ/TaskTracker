<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Task Tracker QA Reporting</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f4f7fb}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}.shell{max-width:1200px;margin:0 auto;padding:28px 20px 48px}.topbar,.row{display:flex;justify-content:space-between;gap:16px;align-items:center}.topbar{margin-bottom:22px}.brand h1{margin:0;font-size:28px}.brand p,.muted{color:#64748b}.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.card{background:#fff;border:1px solid #dbe3ef;border-radius:16px;padding:22px;margin-bottom:18px;box-shadow:0 8px 24px rgba(15,23,42,.04)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.full{grid-column:1/-1}label{display:block;font-weight:700;font-size:13px;margin-bottom:7px}input,select{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:11px 12px;background:#fff}.primary,.secondary{border-radius:10px;padding:11px 16px;font-weight:800}.primary{border:0;background:#1d4ed8;color:#fff}.secondary{border:1px solid #cbd5e1;background:#fff}.message{padding:11px 13px;border-radius:10px;background:#e2e8f0;margin-bottom:18px}.message[data-type=error]{background:#fee2e2;color:#991b1b}.message[data-type=success]{background:#dcfce7;color:#166534}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:16px}.toolbar>div{min-width:170px}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:16px 0}.metric{border:1px solid #94a3b8;border-radius:12px;padding:16px;background:#f8fafc}.metric .label{font-size:11px;text-transform:uppercase;color:#64748b;font-weight:800}.metric .value{font-size:28px;font-weight:900;margin-top:6px}.table-wrap{overflow:auto;border:1px solid #94a3b8;border-radius:12px}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:9px 10px;border-bottom:1px solid #dbe3ef;text-align:left;font-size:12px}th{background:#1e293b;color:#fff}.section-title{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:18px 0 10px}.section-title h2{margin:0;font-size:19px}.readonly{min-height:42px;border:1px solid #cbd5e1;border-radius:10px;padding:11px 12px;background:#f8fafc;font-weight:800}@media(max-width:900px){.metrics{grid-template-columns:1fr 1fr}}@media(max-width:720px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.topbar,.row{align-items:stretch;flex-direction:column}.metrics{grid-template-columns:1fr}.toolbar>div{min-width:100%}}
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <div class="brand"><h1>QA Reporting</h1><p>QA review activity by QA completion date</p></div>
    <div class="top-actions"><a class="secondary" href="history.html" style="text-decoration:none;color:inherit">History</a><a class="secondary" href="training.html" style="text-decoration:none;color:inherit">Training</a><a class="secondary" href="qa.html" style="text-decoration:none;color:inherit">QA</a><a class="secondary" href="index.html" style="text-decoration:none;color:inherit">Home</a></div>
  </div>
  <div id="message" class="message" hidden></div>
  <section id="login" class="card">
    <form id="login-form" class="grid">
      <div><label for="employee">Employee</label><select id="employee" required><option value="">Loading employees...</option></select></div>
      <div><label for="pin">PIN</label><input id="pin" type="password" inputmode="numeric" autocomplete="off" required></div>
      <div class="full"><button class="primary" type="submit">Sign In</button></div>
    </form>
  </section>
  <main id="app" hidden>
    <section class="card"><div class="row"><div><div class="muted">Signed in as</div><strong id="user-name"></strong><div id="viewer-meta" class="muted"></div></div><button id="sign-out" class="secondary" type="button">Sign Out</button></div></section>
    <section class="card">
      <div class="toolbar">
        <div><label for="qa-report-start">Start Date</label><input id="qa-report-start" type="date"></div>
        <div><label for="qa-report-end">End Date</label><input id="qa-report-end" type="date"></div>
        <div id="qa-report-rep-wrap"><label for="qa-report-rep">QA Employee</label><select id="qa-report-rep"><option value="">All QA Employees</option></select></div>
        <div id="qa-report-self-wrap" hidden><label>QA Employee</label><div id="qa-report-self" class="readonly"></div></div>
        <button id="qa-report-load" class="primary" type="button">Load Report</button>
      </div>
      <div class="metrics"><div class="metric"><div class="label">Total Jobs</div><div id="qa-report-jobs" class="value">—</div></div><div class="metric"><div class="label">Total Pieces Reviewed</div><div id="qa-report-pieces" class="value">—</div></div><div class="metric"><div class="label">Total Errors</div><div id="qa-report-errors" class="value">—</div></div><div class="metric"><div class="label">Error Rate</div><div id="qa-report-rate" class="value">—</div></div></div>
      <div id="qa-export-actions" class="top-actions" hidden><button id="qa-export-employee" class="secondary" type="button">Export By QA Employee CSV</button><button id="qa-export-date" class="secondary" type="button">Export By Date CSV</button></div>
      <div class="section-title"><h2>By QA Employee</h2></div><div id="qa-report-by-employee" class="table-wrap"></div>
      <div class="section-title"><h2>By Date</h2></div><div id="qa-report-by-date" class="table-wrap"></div>
    </section>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/csv-export.js?v=qa-reporting-20260820-0958"></script>
<script src="js/qa-reporting.js?v=qa-reporting-20260820-0958"></script>
</body>
</html>
