<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Task Tracker</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f5f7;
      color: #172033;
    }

    main {
      width: min(560px, 100%);
      padding: 48px;
      text-align: center;
      background: #ffffff;
      border: 1px solid #dce2e8;
      border-radius: 18px;
      box-shadow: 0 18px 50px rgba(23, 32, 51, 0.09);
    }

    h1 {
      margin: 0 0 14px;
      font-size: 38px;
    }

    p {
      margin: 0;
      color: #5d6778;
      font-size: 18px;
      line-height: 1.6;
    }

    .status {
      display: inline-block;
      margin-top: 28px;
      padding: 9px 16px;
      border-radius: 999px;
      background: #e8f7ee;
      color: #17653a;
      font-weight: 700;
    }
  </style>
</head>

<body>
  <main>
    <h1>Task Tracker</h1>

    <p>
      The new Task Tracker website is connected to GitHub Pages.
    </p>

    <div class="status">
      Initial website setup complete
    </div>
  </main>
</body>
</html>
