<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Task Tracker Reporting</title><style>:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}.shell{width:100%;max-width:1900px;margin:0 auto;padding:24px 16px 48px}.topbar,.row{display:flex;justify-content:space-between;gap:16px;align-items:center}.topbar{margin-bottom:22px}.brand h1{margin:0;font-size:28px}.brand p,.muted{color:#64748b}.card{background:white;border:1px solid #dbe3ef;border-radius:16px;padding:22px;margin-bottom:18px;box-shadow:0 8px 24px rgba(15,23,42,.04)}#app>section.card:last-child{padding:24px 18px 28px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.full{grid-column:1/-1}label{display:block;font-weight:700;font-size:13px;margin-bottom:7px}input,select{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:10px 11px;background:white}.primary,.secondary{border-radius:10px;padding:11px 16px;font-weight:800}.primary{border:0;background:#1d4ed8;color:white}.secondary{border:1px solid #cbd5e1;background:white}.message{padding:11px 13px;border-radius:10px;background:#e2e8f0;margin-bottom:18px}.message[data-type=error]{background:#fee2e2;color:#991b1b}.message[data-type=success]{background:#dcfce7;color:#166534}.tabs{display:flex;gap:10px;flex-wrap:wrap}.tab{border:1px solid #cbd5e1;background:white;border-radius:10px;padding:10px 14px;font-weight:800}.tab.active{background:#1d4ed8;color:white;border-color:#1d4ed8}.summary{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin:16px 0}.metric{border:1px solid #e2e8f0;border-radius:12px;padding:14px;background:#f8fafc}.metric strong{display:block;font-size:20px;margin-top:4px}.table-wrap{overflow:auto;border:1px solid #e2e8f0;border-radius:12px;width:100%}table{width:100%;border-collapse:collapse;min-width:1400px}th,td{text-align:left;padding:10px 12px;border-bottom:1px solid #e2e8f0;font-size:13px;white-space:nowrap}th{background:#f8fafc;position:sticky;top:0}.pill{display:inline-flex;padding:4px 8px;border-radius:999px;background:#dbeafe;color:#1d4ed8;font-size:12px;font-weight:800}[hidden]{display:none!important}@media(max-width:900px){.shell{padding:18px 12px 36px}.grid{grid-template-columns:1fr 1fr}.summary{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.grid,.summary{grid-template-columns:1fr}.topbar,.row{align-items:stretch;flex-direction:column}}</style></head><body><div class="shell"><div class="topbar"><div class="brand"><h1>Task Tracker Reporting</h1><p>Eastern Time · Saturday week ending</p></div><a class="secondary" href="index.html" style="text-decoration:none;color:inherit">Home</a></div><div id="message" class="message" hidden></div><section id="login" class="card"><form id="login-form" class="grid"><div><label for="employee">Employee</label><select id="employee" required><option value="">Loading employees...</option></select></div><div><label for="pin">PIN</label><input id="pin" type="password" inputmode="numeric" required></div><div class="full"><button class="primary" type="submit">Sign In</button></div></form></section><main id="app" hidden><section class="card"><div class="row"><div><div class="muted">Signed in as</div><strong id="user-name"></strong><div id="viewer-meta" class="muted"></div></div><button id="sign-out" class="secondary" type="button">Sign Out</button></div></section><section class="card"><div class="tabs"><button id="daily-tab" class="tab active" type="button">Daily</button><button id="weekly-tab" class="tab" type="button">Weekly</button></div><div class="grid" style="margin-top:16px"><div><label for="start-date">Start Date</label><input id="start-date" type="date"></div><div><label for="end-date">End Date</label><input id="end-date" type="date"></div><div><label for="rep
