<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Task Tracker QA</title><style>:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{max-width:1200px;margin:0 auto;padding:28px 20px 48px}.topbar,.row{display:flex;justify-content:space-between;gap:16px;align-items:center}.topbar{margin-bottom:22px}.brand h1{margin:0;font-size:28px}.brand p,.muted{color:#64748b}.card{background:#fff;border:1px solid #dbe3ef;border-radius:16px;padding:22px;margin-bottom:18px;box-shadow:0 8px 24px rgba(15,23,42,.04)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.full{grid-column:1/-1}label{display:block;font-weight:700;font-size:13px;margin-bottom:7px}input,select,textarea{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:11px 12px;background:#fff}textarea{min-height:100px;resize:vertical}.primary,.secondary{border-radius:10px;padding:11px 16px;font-weight:800}.primary{border:0;background:#1d4ed8;color:#fff}.secondary{border:1px solid #cbd5e1;background:#fff}.message{padding:11px 13px;border-radius:10px;background:#e2e8f0;margin-bottom:18px}.message[data-type=error]{background:#fee2e2;color:#991b1b}.message[data-type=success]{background:#dcfce7;color:#166534}.queue{display:grid;gap:12px}.job{border:1px solid #e2e8f0;border-radius:12px;padding:14px;background:#f8fafc}.job h3{margin:0 0 6px}.meta{font-size:13px;color:#64748b}.job button{margin-top:12px}.error-category{border:1px solid #e2e8f0;border-radius:12px;padding:12px}.error-category h4{margin:0 0 10px}.error-row{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:12px;align-items:center;padding:7px 0}.review-summary{padding:12px;border-radius:12px;background:#eff6ff;margin-bottom:14px}.pill{display:inline-flex;padding:4px 8px;border-radius:999px;background:#dbeafe;color:#1d4ed8;font-size:12px;font-weight:800}[hidden]{display:none!important}@media(max-width:720px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.topbar,.row{align-items:stretch;flex-direction:column}.error-row{grid-template-columns:1fr}}</style></head><body><div class="shell"><div class="topbar"><div class="brand"><h1>Task Tracker QA</h1><p>Quality review workflow</p></div><a class="secondary" href="index.html" style="text-decoration:none;color:inherit">Home</a></div><div id="message" class="message" hidden></div><section id="login" class="card"><form id="login-form" class="grid"><div><label for="employee">Employee</label><select id="employee" required><option value="">Loading employees...</option></select></div><div><label for="pin">PIN</label><input id="pin" type="password" inputmode="numeric" autocomplete="off" required></div><div class="full"><button class="primary" type="submit">Sign In</button></div></form></section><main id="app" hidden><section class="card"><div class="row"><div><div class="muted">Signed in as</div><strong id="user-name"></strong></div><button id="refresh" class="secondary" type="button">Refresh Queue</button></div></section><section class="card"><div class="row"><div><h2 style="margin:0 0 6px">Pending QA Queue</h2><div class="muted">Ready for QA Productive jobs grouped by current QA status</div></div><span id="queue-count" class="pill">0</span></div><div style="margin-top:16px"><label for="search">Search</label><input id="search" type="search" placeholder="Builder, work order, item, job type, comments"></div><div id="queue" class="queue" style="margin-top:16px"></div></section><section id="review-card" class="card" hidden><h2 style="margin-top:0">QA Review</h2><div id="review-summary" class="review-summary"></div><form id="review-form"><div class="grid"><div><label for="disposition">Quality Status</label><select id="disposition" required></select></div><div><label><input id="training" type="checkbox" style="width:auto;margin-right:8px">Builder in training</label></div><div><label for="qty-pass">Quantity Passed</label><input id="qty-pass" type="number" min="0" step="1"></div><div><label for="qty-reject">Quantity Rejected</label><input id="qty-reject" type="number" min="0" step="1"></div><div><label for="qty-scrap">Scrap Quantity</label><input id="qty-scrap" type="number" min="0" step="1"></div><div><label for="qty-rework">Rework Returned to Builder</label><input id="qty-rework" type="number" min="0" step="1"></div><div><label for="qty-qa-rework">Rework Completed by QA</label><input id="qty-qa-rework" type="number" min="0" step="1"></div><div class="full"><label for="qa-comments">QA Comments</label><textarea id="qa-comments"></textarea></div></div><h3>Error Details</h3><div id="errors"></div><div style="margin-top:18px;display:flex;gap:12px;flex-wrap:wrap"><button id="submit-review" class="primary" type="submit">Submit QA Review</button><button id="cancel-review" class="secondary" type="button">Cancel</button></div></form></section></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/phase5-qa-auditability.js"></script><script src="js/qa-history.js"></script></body></html>
