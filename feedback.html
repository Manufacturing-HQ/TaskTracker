<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Task Tracker - Feedback</title><style>:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--navy:#0b1220;--blue:#2563eb;--bg:#e8eef5;--border:#94a3b8;--text:#172033;--muted:#64748b}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#0b1220,#223252)}.login-card{width:min(460px,92vw);background:#fff;border:2px solid #475569;border-radius:22px;padding:34px}.field{margin-top:14px}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid #94a3b8;border-radius:9px;padding:9px 10px;background:#fff}.primary,.ghost{border-radius:9px;padding:10px 14px;font-weight:800;cursor:pointer}.primary{border:0;background:var(--blue);color:#fff}.ghost{border:1px solid #94a3b8;background:#fff}.login-card .primary{width:100%;margin-top:18px}.msg{margin-top:12px;padding:10px;border-radius:8px;background:#e2e8f0}.msg[data-type=error]{background:#fee2e2;color:#991b1b}.msg[data-type=success]{background:#dcfce7;color:#166534}.shell{max-width:1180px;margin:0 auto;padding:24px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:18px}.top h1{margin:0}.top-actions{display:flex;gap:8px;flex-wrap:wrap}.top-actions a{color:inherit;text-decoration:none}.panel{background:#fff;border:2px solid var(--border);border-radius:16px;padding:20px;margin-bottom:18px}.switch{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.switch button{border:1px solid #94a3b8;background:#fff;border-radius:9px;padding:9px 13px;font-weight:900}.switch button.active{background:#1d4ed8;color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid .full{grid-column:1/-1}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.toolbar .field{margin:0}.cards{display:grid;gap:12px}.card{border:1px solid #94a3b8;border-radius:12px;padding:14px;background:#f8fafc}.meta{font-size:12px;color:#64748b;margin-top:4px}.badge{display:inline-block;padding:3px 8px;border-radius:999px;font-size:10px;font-weight:900;background:#e2e8f0}.badge.bug{background:#fee2e2;color:#991b1b}.badge.improvement{background:#dbeafe;color:#1d4ed8}.badge.pending{background:#fff3bf;color:#7c5c00}.badge.resolved{background:#dcfce7;color:#166534}.updates{margin-top:10px;border-top:1px solid #dbe3ef;padding-top:8px}.update{font-size:12px;padding:6px 0;border-bottom:1px solid #e2e8f0}.empty{padding:14px;color:#64748b;text-align:center}@media(max-width:760px){.grid{grid-template-columns:1fr}.grid .full{grid-column:auto}.top{align-items:flex-start;flex-direction:column}}</style></head><body><div id="login" class="login"><form id="login-form" class="login-card"><h1>Feedback</h1><div style="color:#64748b">Sign in to submit or review feedback.</div><div class="field"><label>Employee</label><select id="employee" required><option>Loading...</option></select></div><div class="field"><label>PIN</label><input id="pin" type="password" inputmode="numeric" required></div><button class="primary" type="submit">Sign In</button><div id="login-message" class="msg" hidden></div></form></div><main id="app" class="shell" hidden><div class="top"><div><h1>Feedback</h1><div id="who" class="meta"></div></div><div class="top-actions"><a class="ghost" href="index.html">Home</a><button id="sign-out" class="ghost" type="button">Sign Out</button></div></div><div id="switch" class="switch"><button id="submit-tab" class="active" type="button">Submit Feedback</button><button id="mine-tab" type="button">My Feedback</button><button id="admin-tab" type="button" hidden>Feedback Dashboard</button></div><section id="submit-view" class="panel"><h2 style="margin-top:0">Submit Feedback</h2><form id="feedback-form" class="grid"><div><label>Type</label><select id="feedback-type"><option>Bug</option><option>Improvement</option></select></div><div><label>Page / Workspace</label><input id="feedback-page" placeholder="Auto-filled when opened from another page"></div><div class="full" id="action-wrap"><label>What were you trying to do?</label><input id="feedback-action" placeholder="Required for bugs"></div><div class="full"><label>What happened / What would you improve?</label><textarea id="feedback-text" rows="6" required></textarea></div><div class="full"><button class="primary" type="submit">Submit Feedback</button></div></form><div id="submit-message" class="msg" hidden></div></section><section id="mine-view" class="panel" hidden><h2 style="margin-top:0">My Feedback</h2><div id="mine-list" class="cards"></div></section><section id="admin-view" class="panel" hidden><div class="top" style="margin-bottom:12px"><div><h2 style="margin:0">Feedback Dashboard</h2><div class="meta">Pending items are shown first.</div></div></div><div class="toolbar"><div class="field"><label>Type</label><select id="admin-type"><option value="">All</option><option>Bug</option><option>Improvement</option></select></div><div class="field"><label>Status</label><select id="admin-status"><option value="">All</option><option>Pending</option><option>Resolved</option></select></div><div class="field"><label>Employee</label><select id="admin-employee"><option value="">All</option></select></div><div class="field"><label>Start</label><input id="admin-start" type="date"></div><div class="field"><label>End</label><input id="admin-end" type="date"></div><button id="admin-load" class="primary" type="button">Load</button></div><div id="admin-list" class="cards" style="margin-top:14px"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/feedback.js"></script></body></html>
